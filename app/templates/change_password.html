<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { font-family: Arial, sans-serif; background:#f8f9fa; margin:0; }
        .container { width:100%; max-width:600px; margin:40px auto; background:#fff; padding:24px; border-radius:8px; box-shadow:0 2px 8px #ccc; }
        h1 { color:#333; }
        label { display:block; margin:12px 0 4px; font-weight:bold; }
        input { width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; }
        button { background:#007bff; color:#fff; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; font-weight:bold; }
        button:hover { background:#0056b3; }
        .menu { background:#007bff; padding:12px; border-radius:8px 8px 0 0; display:flex; flex-wrap:wrap; align-items:center; }
        .menu a { color:#fff; margin-right:20px; text-decoration:none; font-weight:bold; }
        .menu a:hover { text-decoration:underline; }
        .menu span { margin-left:auto; color:#fff; font-weight:bold; }
        .error { color:#b30000; background:#ffe6e6; padding:8px; border:1px solid #ffb3b3; border-radius:4px; margin-bottom:12px; }
        .success { color:#065f46; background:#d1fae5; padding:8px; border:1px solid #10b981; border-radius:4px; margin-bottom:12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="menu">
        <a href="/">Home</a>
        {% if current_user and current_user.designation_id == 1 %}<a href="/employees">Employees</a>{% endif %}
        <a href="/tasks">Tasks</a>
        <a href="/tasks/assign">Assign Task</a>
        <a href="/tasks/report">Task Report</a>
        <a href="/profile">My Profile</a>
        <a href="/change_password">Change Password</a>
        <span>{{ current_user.name }} | <a href="/logout" style="color:#fff;">Logout</a></span>
    </div>
    <h1>Change Password</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if success %}<div class="success">{{ success }}</div>{% endif %}
    <form method="POST">
        <label for="current_password">Current Password:</label>
        <input type="password" name="current_password" id="current_password" required>
        <label for="new_password">New Password:</label>
        <input type="password" name="new_password" id="new_password" required>
        <label for="confirm_password">Confirm New Password:</label>
        <input type="password" name="confirm_password" id="confirm_password" required>
        <button type="submit">Update Password</button>
    </form>
    <a href="/tasks" style="display:inline-block; margin-top:16px;">Back to Tasks</a>
</div>
</body>
</html>
