<!DOCTYPE html>
<html>
<head>
    <title>Assign Task</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; margin: 0; }
        .container { width: 100%; max-width: 900px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px #ccc; }
        h1 { color: #333; }
        form { margin-top: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-bottom: 16px; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #007bff; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .menu { background: #007bff; padding: 12px; border-radius: 8px 8px 0 0; display: flex; flex-wrap: wrap; align-items: center; }
        .menu a { color: #fff; margin-right: 20px; text-decoration: none; font-weight: bold; }
        .menu a:hover { text-decoration: underline; }
        .menu span { margin-left: auto; }
        @media (max-width: 1000px) {
            .container { max-width: 98vw; }
        }
        @media (max-width: 768px) {
            .container { padding: 8px; max-width: 100vw; }
            form, label, input, select, button { font-size: 0.95em; }
            .menu { flex-direction: column; align-items: flex-start; }
            .menu a, .menu span { margin: 8px 0; }
        }
        @media (max-width: 480px) {
            .container { padding: 8px; max-width: 100vw; }
            h1 { font-size: 1.2em; }
            form, label, input, select, button { font-size: 0.85em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="menu">
            <a href="/">Home</a>
            {% if current_user and current_user.designation_id == 1 %}
            <a href="/employees">Employees</a>
            {% endif %}
            <a href="/tasks">Tasks</a>
            <a href="/tasks/assign">Assign Task</a>
            <a href="/tasks/report">Task Report</a>
            <span style="float:right; color:#fff; font-weight:bold;">{{ current_user.name }} | <a href="/logout" style="color:#fff;">Logout</a></span>
        </div>
        <h1>Assign Task</h1>
        {% if error %}<div style="color:red">{{ error }}</div>{% endif %}
        <form method="POST">
            <label>Task Name:</label>
            <input type="text" name="name" required><br>
            <label>Task Category:</label>
            <select name="category" required>
                <option value="personal">Personal</option>
                <option value="team">Team</option>
            </select><br>
            <label>Task Type:</label>
            <select name="type" required>
                {% for t in task_types %}
                <option value="{{ t }}">{{ t }}</option>
                {% endfor %}
            </select><br>
            <label>Start Date:</label>
            <input type="date" name="start_date" required><br>
            <label>End Date:</label>
            <input type="date" name="end_date" required><br>
            <label>Numeric Target:</label>
            <input type="number" name="target" min="1" required><br>
            <label>Status:</label>
            <select name="status" required>
                <option value="todo">To Do</option>
                <option value="in progress">In Progress</option>
                <option value="completed">Completed</option>
                <option value="blocked">Blocked</option>
            </select><br>
            <label>Current Progress:</label>
            <input type="number" name="current_progress" min="0" value="0" required><br>
            <label>Assign By (Manager):</label>
            <input type="text" value="{{ current_user.name }}" readonly>
            <input type="hidden" name="assigned_by" value="{{ current_user.id }}">
            <label>Assign To (Employee):</label>
            <select name="assigned_to" required>
                <option value="" disabled selected>-- Select Employee --</option>
                {% for emp in employees %}
                <option value="{{ emp.id }}">{{ emp.name }}</option>
                {% endfor %}
            </select>
            <br>
            <button type="submit">Assign Task</button>
        </form>
        <a href="/tasks">Back to Tasks</a>
    </div>
</body>
</html>
